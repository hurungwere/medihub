<svg width="520" height="80" viewBox="0 0 520 80" xmlns="http://www.w3.org/2000/svg">
  <title>MediHub Logo — Full Color</title>
  <!-- Hub icon -->
  <circle cx="40" cy="40" r="16" fill="#0066CC"/>
  <circle cx="40" cy="40" r="22" fill="none" stroke="#0066CC" stroke-width="1" opacity="0.2"/>
  <!-- Spokes -->
  <line x1="40" y1="24" x2="40" y2="8" stroke="#00B8A9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="31" x2="63" y2="19" stroke="#00B8A9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="47" x2="66" y2="56" stroke="#00A86B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="56" x2="40" y2="72" stroke="#00A86B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="47" x2="14" y2="56" stroke="#00B8A9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="31" x2="17" y2="19" stroke="#00B8A9" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Outer nodes -->
  <circle cx="40" cy="4" r="5" fill="#00B8A9"/>
  <circle cx="68" cy="14" r="4" fill="#00B8A9" opacity="0.8"/>
  <circle cx="70" cy="60" r="5" fill="#00A86B"/>
  <circle cx="40" cy="76" r="4" fill="#00A86B" opacity="0.8"/>
  <circle cx="10" cy="60" r="5" fill="#00B8A9"/>
  <circle cx="12" cy="14" r="4" fill="#0066CC" opacity="0.7"/>
  <!-- Cross in hub -->
  <rect x="37" y="35" width="6" height="10" rx="1.5" fill="white" opacity="0.95"/>
  <rect x="35" y="38" width="10" height="4" rx="1.5" fill="white" opacity="0.95"/>
  <!-- Wordmark -->
  <text x="90" y="34" font-family="-apple-system,'Inter','Segoe UI',sans-serif" font-size="28" font-weight="300" letter-spacing="-0.3" fill="#2D3748">Medi</text>
  <text x="156" y="34" font-family="-apple-system,'Inter','Segoe UI',sans-serif" font-size="28" font-weight="600" letter-spacing="-0.3" fill="#0066CC">Hub</text>
  <!-- Tagline -->
  <text x="90" y="50" font-family="-apple-system,'Inter','Segoe UI',sans-serif" font-size="8" font-weight="400" fill="#00B8A9" letter-spacing="0.16em">HEALTHCARE PROCUREMENT NETWORK</text>
</svg>
